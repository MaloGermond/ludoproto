<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>astro — orbital launch</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
      color: #fff;
    }
    canvas {
      display: block;
    }
    [hidden] {
      display: none !important;
    }
    button {
      font: inherit;
      font-size: 13px;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.2);
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    button.primary {
      background: rgba(130, 255, 170, 0.25);
      border-color: rgba(130, 255, 170, 0.6);
    }
    #toolbar {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
    }
    #node-panel {
      position: fixed;
      top: 60px;
      right: 16px;
      width: 280px;
      padding: 12px;
      background: rgba(10, 14, 28, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      font-size: 13px;
    }
    #node-panel .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    #node-panel label {
      display: block;
      margin-top: 10px;
    }
    #node-panel output {
      float: right;
      font-variant-numeric: tabular-nums;
    }
    #node-panel input[type="range"] {
      width: 100%;
      margin: 4px 0 0;
    }
    #node-panel .presets {
      display: flex;
      gap: 4px;
      margin-top: 6px;
    }
    #node-panel .presets button {
      flex: 1;
      padding: 4px 0;
      font-size: 12px;
    }
    #node-info {
      margin: 10px 0 0;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.5;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="btn-plan" type="button">⏸ Planifier</button>
    <button id="btn-circularize" type="button" hidden>○ Orbite circulaire</button>
    <button id="btn-clear" type="button" hidden>Effacer le plan</button>
    <button id="btn-launch" class="primary" type="button" hidden>▶ Lancer le plan</button>
  </div>

  <div id="node-panel" hidden>
    <div class="panel-head">
      <strong id="node-title">Manœuvre</strong>
      <button id="btn-delete" type="button">Supprimer</button>
    </div>
    <label>Départ <output id="out-time"></output>
      <input id="in-time" type="range" min="0" max="300" step="0.1" />
    </label>
    <label>Cap par rapport au prograde <output id="out-heading"></output>
      <input id="in-heading" type="range" min="-180" max="180" step="1" />
    </label>
    <div class="presets">
      <button type="button" data-heading="0">Prograde</button>
      <button type="button" data-heading="180">Rétrograde</button>
      <button type="button" data-heading="-90">−90°</button>
      <button type="button" data-heading="90">+90°</button>
    </div>
    <label>Puissance <output id="out-power"></output>
      <input id="in-power" type="range" min="0" max="100" step="1" />
    </label>
    <label>Durée de poussée <output id="out-duration"></output>
      <input id="in-duration" type="range" min="0" max="20" step="0.1" />
    </label>
    <p id="node-info"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.3/lib/p5.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
